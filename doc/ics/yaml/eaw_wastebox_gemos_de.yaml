howto:
  en: |
    - Go to the EAW waste calendar at <https://eaw.wastebox.gemos-management.de/Gemos/WasteBox/Frontend/TourSchedule/> (also embedded at <https://www.abfallwirtschaft-msh.de/index.php/eaw-services-hm/eaw-tup-web-hm>).
    - Select your town (`Ort/Ortsteil`) and, if asked, your street. Adjust the waste types and the residual waste rhythm if needed.
    - Click `Exportieren iCal` and copy the link shown in the dialog.
    - Use this link as the `url` parameter.
    - The link contains IDs that change when EAW publishes a new tour plan (usually once a year). The feed then only shows the entry "Es sind neue Abfuhrtermine verfügbar!". Generate a new link and update the `url` when that happens.
  de: |
    - Öffnen Sie den EAW-Tourenplan unter <https://eaw.wastebox.gemos-management.de/Gemos/WasteBox/Frontend/TourSchedule/> (auch eingebettet unter <https://www.abfallwirtschaft-msh.de/index.php/eaw-services-hm/eaw-tup-web-hm>).
    - Wählen Sie Ihren Ort (`Ort/Ortsteil`) und, falls abgefragt, Ihre Straße. Passen Sie bei Bedarf die Sammelsysteme und den Restabfall-Rhythmus an.
    - Klicken Sie auf `Exportieren iCal` und kopieren Sie den angezeigten Link.
    - Verwenden Sie diesen Link als `url`-Parameter.
    - Der Link enthält IDs, die sich ändern, wenn die EAW einen neuen Tourenplan veröffentlicht (in der Regel einmal im Jahr). Der Kalender zeigt dann nur noch den Eintrag "Es sind neue Abfuhrtermine verfügbar!". Erzeugen Sie in diesem Fall einen neuen Link und ersetzen Sie die `url`.
