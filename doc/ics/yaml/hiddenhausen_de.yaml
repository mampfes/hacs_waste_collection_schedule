---
title: Hiddenhausen
url: https://www.hiddenhausen.de
country: de
howto:
  de: |
    - Gehen Sie auf <https://www.hiddenhausen.de/Rathaus/Services/Abfall/Abfallkalender-online/> und wählen Sie Ihre Straße aus (der Abfuhrbezirk 1-6 wird automatisch anhand der Straße ermittelt).
    - Klicken Sie mit der rechten Maustaste auf "Export in Kalenderanwendung" und kopieren Sie die Link-Adresse.
    - Finden Sie darin den Wert des Parameters `strasse` (z.B. `1500.6.1` für Allensteiner Straße) und verwenden Sie ihn als `strasse`-Parameter unten.
    - Die Beispielkonfiguration enthält bereits alle verfügbaren Abfallarten für das ganze Jahr. Entfernen Sie ggf. einzelne `abfart`-Einträge, wenn Sie bestimmte Abfallarten (z.B. Sondermüll, Sperrmüll) nicht angezeigt bekommen möchten.
  en: |
    - Go to <https://www.hiddenhausen.de/Rathaus/Services/Abfall/Abfallkalender-online/> and select your street (the collection district 1-6 is determined automatically from the street).
    - Right-click "Export in Kalenderanwendung" and copy the link address.
    - Find the value of the `strasse` parameter in it (e.g. `1500.6.1` for Allensteiner Straße) and use it as the `strasse` parameter below.
    - The example configuration already includes all available waste types for the whole year. Remove individual `abfart` entries if you don't want certain waste types shown (e.g. hazardous waste, bulky waste).
