---
name: Dashboard cards

on:
  pull_request:
    paths:
      - frontend/**
      - custom_components/waste_collection_schedule/frontend/**
      - .github/workflows/frontend.yaml
  push:
    branches: [master]
    paths:
      - frontend/**
      - custom_components/waste_collection_schedule/frontend/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - name: Verify the bundled cards match their source
        run: git diff --exit-code -- ../custom_components/waste_collection_schedule/frontend
