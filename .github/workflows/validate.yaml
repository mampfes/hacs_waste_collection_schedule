---
name: Validate Waste Collection Schedule

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: standalone (${{ matrix.python_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install and test without Home Assistant
        run: |
          python -m venv "${{ runner.temp }}/wcs-standalone"
          "${{ runner.temp }}/wcs-standalone/bin/python" -m pip install dist/*.whl packaging
          "${{ runner.temp }}/wcs-standalone/bin/python" -m pip check
          "${{ runner.temp }}/wcs-standalone/bin/python" -I tests/standalone_smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        # uv resolves and installs Home Assistant's dependency tree several
        # times faster than pip; its cache is keyed on requirements.txt.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check . --select E9,F63,F7,F82 --output-format=full --statistics
      - name: Install pre-commit dependencies
        if: github.event_name == 'pull_request'
        run: uv pip install --system pre-commit -r requirements.txt "homeassistant==2024.4.0" "josepy<2"
      - name: Cache pre-commit hook environments
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit (PR changes only)
        if: github.event_name == 'pull_request'
        run: |
          pre-commit run --show-diff-on-failure --color=always --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

  validate:
    name: validate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            python_version: '3.12'
            homeassistant_spec: homeassistant==2024.4.0
            josepy_spec: josepy<2
          - lane: current
            python_version: '3.14'
            homeassistant_spec: homeassistant
            josepy_spec: josepy

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Set up uv
        # uv resolves and installs Home Assistant's dependency tree several
        # times faster than pip. The cache suffix keeps the two lanes apart.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
          cache-suffix: ${{ matrix.lane }}
      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-xdist freezegun -r requirements.txt "${{ matrix.homeassistant_spec }}" "${{ matrix.josepy_spec }}"
      - name: Test components with pytest
        run: |
          python -c "from custom_components.waste_collection_schedule import config_flow"
          # Exclude `live` tests (they fetch real provider endpoints); the
          # gating run stays deterministic and offline. One xdist worker per
          # logical CPU (four on GitHub's standard Linux runners). `-n auto`
          # would count physical cores only, because Home Assistant pulls in
          # psutil, and start just two.
          pytest -m "not live" --ignore=tests/test_offline_fixtures.py -n logical --durations=20
      - name: Replay offline cassettes on all runner CPUs
        # The fallback ceiling is merged across workers (tests/offline_replay.py),
        # so it still gates the full pass.
        run: pytest tests/test_offline_fixtures.py -n logical --dist load --durations=20
      - name: Report BaseSource pipeline coverage
        run: |
          # Informational migration metric (RFC #6561); never fails the build.
          python tools/arch_coverage.py

  generated-files:
    name: generated files
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch the PR base
        # checkout@v5 on pull_request checks out the merge commit. fetch-depth
        # 0 brings in the PR head as a parent; this extra fetch makes the base
        # sha available for fork PRs too. Compare against HEAD (the merge
        # commit) so we do not depend on head.sha being a named ref.
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject edits to fully generated files
        run: >
          python tools/check_generated_files.py
          --base ${{ github.event.pull_request.base.sha }}
          --head HEAD
