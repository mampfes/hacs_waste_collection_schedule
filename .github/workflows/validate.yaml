---
name: Validate Waste Collection Schedule

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: standalone (${{ matrix.python_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install and test without Home Assistant
        run: |
          python -m venv "${{ runner.temp }}/wcs-standalone"
          "${{ runner.temp }}/wcs-standalone/bin/python" -m pip install dist/*.whl packaging
          "${{ runner.temp }}/wcs-standalone/bin/python" -m pip check
          "${{ runner.temp }}/wcs-standalone/bin/python" -I tests/standalone_smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check . --select E9,F63,F7,F82 --output-format=full --statistics
      - name: Install pre-commit dependencies
        if: github.event_name == 'pull_request'
        run: pip install pre-commit -r requirements.txt "homeassistant==2024.4.0" "josepy<2"
      - name: Run pre-commit (PR changes only)
        if: github.event_name == 'pull_request'
        run: |
          pre-commit run --show-diff-on-failure --color=always --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

  validate:
    name: validate (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            python_version: '3.12'
            homeassistant_spec: homeassistant==2024.4.0
            josepy_spec: josepy<2
          - lane: current
            python_version: '3.14'
            homeassistant_spec: homeassistant
            josepy_spec: josepy

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist freezegun -r requirements.txt "${{ matrix.homeassistant_spec }}" "${{ matrix.josepy_spec }}"
      - name: Test components with pytest
        run: |
          python -c "from custom_components.waste_collection_schedule import config_flow"
          # Exclude `live` tests (they fetch real provider endpoints); the
          # gating run stays deterministic and offline.
          pytest -m "not live" --ignore=tests/test_offline_fixtures.py --durations=20
      - name: Replay offline cassettes on two workers
        run: pytest tests/test_offline_fixtures.py -n 2 --dist load --durations=20
      - name: Report BaseSource pipeline coverage
        run: |
          # Informational migration metric (RFC #6561); never fails the build.
          python tools/arch_coverage.py
